name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository-Secret (Settings > Secrets and variables > Actions).
          # Wird zur Build-Zeit ins öffentliche JS-Bundle eingebettet -
          # nur einen kostenlosen Free-Tier-Key verwenden!
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          # Optional: DeepSeek als zweiter KI-Anbieter (siehe deepseek-proxy/README.md).
          # Anders als der Gemini-Key ist das hier nur die URL eines eigenen Proxys, kein
          # echter API-Key - unproblematisch, im öffentlichen Bundle zu haben.
          VITE_DEEPSEEK_PROXY_URL: ${{ vars.VITE_DEEPSEEK_PROXY_URL }}
          VITE_DEEPSEEK_PROXY_TOKEN: ${{ secrets.VITE_DEEPSEEK_PROXY_TOKEN }}
          # Optional: Passwortschutz (siehe src/components/PasswordGate.tsx) - ein
          # SHA-256-Hash, kein Klartext-Passwort, aber trotzdem als Secret hinterlegt.
          VITE_ACCESS_PASSWORD_HASH: ${{ secrets.VITE_ACCESS_PASSWORD_HASH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
